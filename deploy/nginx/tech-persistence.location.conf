# Include this snippet inside the existing songuu.top HTTPS server block.
# The deployer atomically repoints /opt/tech-persistence/current.

location = /tech-persistence {
  return 301 /tech-persistence/;
}

location ^~ /tech-persistence/api/v1/ {
  proxy_pass http://127.0.0.1:5183;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection "";
  proxy_connect_timeout 2s;
  proxy_send_timeout 10s;
  proxy_read_timeout 10s;
  proxy_request_buffering on;
  proxy_buffering off;
  client_max_body_size 32k;
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /tech-persistence/ {
  alias /opt/tech-persistence/current/;
  index index.html;
  try_files $uri $uri/ $uri.html /tech-persistence/index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
